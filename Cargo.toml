# Rust functions for Vercel. Each [[bin]] in api/ becomes a serverless function at /api/<name>.
#
# Trinity Explained (served at /trinity) comes from the trinity repository as a git dependency.
# The commit in Cargo.lock is also the commit scripts/build-trinity-web.mjs builds the front end
# from, so the API and the pages always match. To update both: `cargo update -p trinity-core`.
[package]
name = "reasonsforchrist-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
trinity-core = { git = "https://github.com/samueldotj/trinity.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
vercel_runtime = "2"
serde_json = "1"
form_urlencoded = "1"

# Trinity's front end calls /api/handler, so the function keeps that name.
[[bin]]
name = "handler"
path = "api/handler.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
